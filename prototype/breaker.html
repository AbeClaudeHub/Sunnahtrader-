<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE LEDGER — Circuit Breaker</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<style>
  body { overflow: hidden; background: var(--ink); }
  .screen {
    width: 390px;
    height: 844px;
    margin: 0 auto;
    padding: var(--s-8);
    position: relative;
  }
  /* the sealed frame — wax border around the takeover */
  .frame {
    height: 100%;
    border: var(--border) solid var(--wax);
    padding: var(--s-24);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .head {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .head .label { color: var(--wax); }
  .seal-mark { flex-shrink: 0; }

  .clock-wrap { margin-top: auto; }
  .countdown {
    font-family: var(--mono);
    font-size: var(--t-84);
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--paper);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .clock-rule {
    width: 232px;
    height: 16px;
    margin: var(--s-16) auto 0;
    position: relative;
  }
  .clock-rule .total {
    position: absolute; top: 8px; left: 0; right: 0;
    border-top: 0.5px solid rgba(240, 233, 219, 0.35);
  }
  .clock-rule .elapsed {
    position: absolute; top: 7.25px; left: 0; width: 15.4%;
    border-top: 1.5px solid var(--wax);
  }
  .clock-sub {
    font-size: var(--t-11);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(240, 233, 219, 0.5);
    margin-top: var(--s-8);
  }

  .instruction {
    margin-top: var(--s-64);
    font-family: var(--display);
    font-size: var(--t-34);
    font-variation-settings: 'opsz' 50;
    font-weight: 480;
    line-height: 1.2;
    color: var(--paper);
    max-width: 280px;
  }
  .instruction-count {
    margin-top: var(--s-16);
    font-family: var(--mono);
    font-size: var(--t-11);
    letter-spacing: 0.14em;
    color: rgba(240, 233, 219, 0.5);
  }

  /* VERSE SLOT: restraint in anger — founder may place authenticated text here */

  .exit { margin-top: auto; width: 100%; }
  .exit-label {
    font-size: var(--t-11);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(240, 233, 219, 0.45);
  }
  .exit-input {
    margin-top: var(--s-8);
    width: 100%;
    background: none;
    border: none;
    border-bottom: 0.5px solid rgba(240, 233, 219, 0.35);
    padding: var(--s-8) 0;
    font-family: var(--display);
    font-style: italic;
    font-size: var(--t-15);
    color: var(--paper);
    text-align: center;
  }
  .exit-input::placeholder { color: rgba(240, 233, 219, 0.3); }
  .exit-warning {
    margin-top: var(--s-8);
    font-size: var(--t-11);
    letter-spacing: 0.08em;
    color: var(--wax);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="frame">
      <div class="head">
        <span class="label">Circuit breaker</span>
        <svg class="seal-mark" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#7A2E1F" stroke-width="1.5" aria-hidden="true">
          <path d="M13 2.2 C 18.6 1.8, 24.1 6.9, 23.8 13.1 C 23.5 19.4, 18.9 24.2, 12.8 23.8 C 6.8 23.5, 2.1 18.8, 2.3 12.8 C 2.5 6.9, 7.3 2.5, 13 2.2 Z"/>
          <path d="M9.5 8 v5.5 a3.5 3.5 0 0 0 7 0 V8"/>
          <path d="M13 17 v2.5"/>
        </svg>
      </div>

      <div class="clock-wrap">
        <div class="countdown">12:41</div>
        <div class="clock-rule"><div class="total"></div><div class="elapsed"></div></div>
        <p class="clock-sub">The market will still be there</p>
      </div>

      <p class="instruction">Hands off the platform.</p>
      <p class="instruction-count">STEP 1 / 3</p>

      <div class="exit">
        <p class="exit-label">To leave early, type it in full</p>
        <input class="exit-input" type="text" placeholder="I am choosing to break my contract" aria-label="Type the early-exit phrase in full">
        <p class="exit-warning">Early exit is recorded as a breach.</p>
      </div>
    </div>
  </div>
</body>
</html>
